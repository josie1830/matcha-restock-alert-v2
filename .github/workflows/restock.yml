name: Matcha restock check

on:
  schedule:
    - cron: "2-59/5 * * * *"

  workflow_dispatch:
    inputs:
      test_mode:
        description: "Only check and display current stock without sending notifications"
        type: boolean
        default: false
      notify_current_stock:
        description: "Send current stock list to LINE once"
        type: boolean
        default: false

concurrency:
  group: matcha-restock
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Create config if none is committed
        run: |
          if [ ! -f config.json ]; then
            cp config.example.json config.json
            echo "No config.json found; using example defaults."
          fi

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore previous stock state
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: matcha-state-${{ github.run_id }}
          restore-keys: |
            matcha-state-

      - name: Check for restocks
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: |
          if [ "${{ inputs.notify_current_stock }}" = "true" ]; then
            python bot.py --notify-current-stock
          elif [ "${{ inputs.test_mode }}" = "true" ]; then
            python bot.py --test
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python bot.py --once --ignore-schedule
          else
            python bot.py --once
          fi

      - name: Save stock state
        if: ${{ always() && inputs.test_mode != true && inputs.notify_current_stock != true }}        
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: matcha-state-${{ github.run_id }}
